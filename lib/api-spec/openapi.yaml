openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Portfolio API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public portfolio data
  - name: auth
    description: Authentication
  - name: admin
    description: Admin CRUD operations
  - name: contact
    description: Contact form

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Profile ───────────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [public]
      summary: Get profile/about info
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [admin]
      summary: Update profile (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Auth token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin user
      responses:
        "200":
          description: Admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized

  # ─── Projects ──────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: getProjects
      tags: [public]
      summary: List all projects
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [admin]
      summary: Create a project (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [public]
      summary: Get single project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [admin]
      summary: Update project (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [admin]
      summary: Delete project (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Skills ────────────────────────────────────────────────────────────────
  /skills:
    get:
      operationId: getSkills
      tags: [public]
      summary: List skills
      responses:
        "200":
          description: Skills list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [admin]
      summary: Create skill (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "201":
          description: Created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /skills/{id}:
    patch:
      operationId: updateSkill
      tags: [admin]
      summary: Update skill (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    delete:
      operationId: deleteSkill
      tags: [admin]
      summary: Delete skill (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Experience ────────────────────────────────────────────────────────────
  /experience:
    get:
      operationId: getExperience
      tags: [public]
      summary: List experience entries
      responses:
        "200":
          description: Experience list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
    post:
      operationId: createExperience
      tags: [admin]
      summary: Create experience entry (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "201":
          description: Created experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"

  /experience/{id}:
    patch:
      operationId: updateExperience
      tags: [admin]
      summary: Update experience (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperienceInput"
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
    delete:
      operationId: deleteExperience
      tags: [admin]
      summary: Delete experience (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Testimonials ──────────────────────────────────────────────────────────
  /testimonials:
    get:
      operationId: getTestimonials
      tags: [public]
      summary: List testimonials
      responses:
        "200":
          description: Testimonials list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [admin]
      summary: Create testimonial (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created testimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /testimonials/{id}:
    patch:
      operationId: updateTestimonial
      tags: [admin]
      summary: Update testimonial (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "200":
          description: Updated testimonial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteTestimonial
      tags: [admin]
      summary: Delete testimonial (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Certificates ──────────────────────────────────────────────────────────
  /certificates:
    get:
      operationId: getCertificates
      tags: [public]
      summary: List certificates
      responses:
        "200":
          description: Certificates list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [admin]
      summary: Create certificate (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /certificates/{id}:
    patch:
      operationId: updateCertificate
      tags: [admin]
      summary: Update certificate (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [admin]
      summary: Delete certificate (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Achievements ──────────────────────────────────────────────────────────
  /achievements:
    get:
      operationId: getAchievements
      tags: [public]
      summary: List achievements
      responses:
        "200":
          description: Achievements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"
    post:
      operationId: createAchievement
      tags: [admin]
      summary: Create achievement (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementInput"
      responses:
        "201":
          description: Created achievement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"

  /achievements/{id}:
    patch:
      operationId: updateAchievement
      tags: [admin]
      summary: Update achievement (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementInput"
      responses:
        "200":
          description: Updated achievement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
    delete:
      operationId: deleteAchievement
      tags: [admin]
      summary: Delete achievement (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Contact ───────────────────────────────────────────────────────────────
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
        "400":
          description: Validation error

  /messages:
    get:
      operationId: getMessages
      tags: [admin]
      summary: Get all contact messages (admin)
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactMessage"

  /messages/{id}:
    patch:
      operationId: updateMessage
      tags: [admin]
      summary: Mark message as read (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageStatusInput"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
    delete:
      operationId: deleteMessage
      tags: [admin]
      summary: Delete message (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Analytics ─────────────────────────────────────────────────────────────
  /analytics:
    get:
      operationId: getAnalytics
      tags: [admin]
      summary: Get portfolio analytics (admin)
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"

  # ─── GitHub Stats ──────────────────────────────────────────────────────────
  /github-stats:
    get:
      operationId: getGithubStats
      tags: [public]
      summary: Get GitHub stats summary
      responses:
        "200":
          description: GitHub stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Auth ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AdminUser"

    AdminUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string

    # ─── Profile ─────────────────────────────────────────────────────────────
    Profile:
      type: object
      required: [id, name, title, bio]
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
        bio:
          type: string
        location:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        github:
          type: ["string", "null"]
        linkedin:
          type: ["string", "null"]
        twitter:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        youtube:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        resumeUrl:
          type: ["string", "null"]
        yearsOfExperience:
          type: integer
        projectsCompleted:
          type: integer
        happyClients:
          type: integer
        openSourceContributions:
          type: integer
        tagline:
          type: ["string", "null"]
        availableForWork:
          type: boolean

    ProfileInput:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        bio:
          type: string
        location:
          type: string
        email:
          type: string
        phone:
          type: string
        website:
          type: string
        github:
          type: string
        linkedin:
          type: string
        twitter:
          type: string
        instagram:
          type: string
        youtube:
          type: string
        avatarUrl:
          type: string
        resumeUrl:
          type: string
        yearsOfExperience:
          type: integer
        projectsCompleted:
          type: integer
        happyClients:
          type: integer
        openSourceContributions:
          type: integer
        tagline:
          type: string
        availableForWork:
          type: boolean

    # ─── Project ─────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, title, description, category, techStack, featured, order]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        longDescription:
          type: ["string", "null"]
        category:
          type: string
        techStack:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        liveUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        featured:
          type: boolean
        order:
          type: integer
        status:
          type: string
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [title, description, category, techStack]
      properties:
        title:
          type: string
        description:
          type: string
        longDescription:
          type: string
        category:
          type: string
        techStack:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        videoUrl:
          type: string
        liveUrl:
          type: string
        githubUrl:
          type: string
        featured:
          type: boolean
        order:
          type: integer
        status:
          type: string

    # ─── Skill ───────────────────────────────────────────────────────────────
    Skill:
      type: object
      required: [id, name, category, proficiency, icon, order]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        proficiency:
          type: integer
        icon:
          type: string
        color:
          type: ["string", "null"]
        order:
          type: integer

    SkillInput:
      type: object
      required: [name, category, proficiency, icon]
      properties:
        name:
          type: string
        category:
          type: string
        proficiency:
          type: integer
        icon:
          type: string
        color:
          type: string
        order:
          type: integer

    # ─── Experience ──────────────────────────────────────────────────────────
    Experience:
      type: object
      required: [id, company, role, startDate, order]
      properties:
        id:
          type: integer
        company:
          type: string
        role:
          type: string
        description:
          type: ["string", "null"]
        responsibilities:
          type: array
          items:
            type: string
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        current:
          type: boolean
        companyLogo:
          type: ["string", "null"]
        companyUrl:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        techStack:
          type: array
          items:
            type: string
        order:
          type: integer

    ExperienceInput:
      type: object
      required: [company, role, startDate]
      properties:
        company:
          type: string
        role:
          type: string
        description:
          type: string
        responsibilities:
          type: array
          items:
            type: string
        startDate:
          type: string
        endDate:
          type: string
        current:
          type: boolean
        companyLogo:
          type: string
        companyUrl:
          type: string
        location:
          type: string
        techStack:
          type: array
          items:
            type: string
        order:
          type: integer

    # ─── Testimonial ─────────────────────────────────────────────────────────
    Testimonial:
      type: object
      required: [id, name, role, company, content, rating]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        company:
          type: string
        content:
          type: string
        rating:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        featured:
          type: boolean

    TestimonialInput:
      type: object
      required: [name, role, company, content, rating]
      properties:
        name:
          type: string
        role:
          type: string
        company:
          type: string
        content:
          type: string
        rating:
          type: integer
        avatarUrl:
          type: string
        linkedinUrl:
          type: string
        featured:
          type: boolean

    # ─── Certificate ─────────────────────────────────────────────────────────
    Certificate:
      type: object
      required: [id, title, issuer, issueDate]
      properties:
        id:
          type: integer
        title:
          type: string
        issuer:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: ["string", "null"]
        credentialId:
          type: ["string", "null"]
        credentialUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string

    CertificateInput:
      type: object
      required: [title, issuer, issueDate]
      properties:
        title:
          type: string
        issuer:
          type: string
        issueDate:
          type: string
        expiryDate:
          type: string
        credentialId:
          type: string
        credentialUrl:
          type: string
        imageUrl:
          type: string
        skills:
          type: array
          items:
            type: string

    # ─── Achievement ─────────────────────────────────────────────────────────
    Achievement:
      type: object
      required: [id, title, description, icon, year]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        year:
          type: integer
        url:
          type: ["string", "null"]
        order:
          type: integer

    AchievementInput:
      type: object
      required: [title, description, icon, year]
      properties:
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        year:
          type: integer
        url:
          type: string
        order:
          type: integer

    # ─── Contact ─────────────────────────────────────────────────────────────
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        subject:
          type: string
          minLength: 3
        message:
          type: string
          minLength: 10
        phone:
          type: string
        budget:
          type: string
        projectType:
          type: string

    ContactMessage:
      type: object
      required: [id, name, email, subject, message, read, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        message:
          type: string
        phone:
          type: ["string", "null"]
        budget:
          type: ["string", "null"]
        projectType:
          type: ["string", "null"]
        read:
          type: boolean
        createdAt:
          type: string

    MessageStatusInput:
      type: object
      properties:
        read:
          type: boolean

    # ─── Analytics ───────────────────────────────────────────────────────────
    Analytics:
      type: object
      required: [totalProjects, totalSkills, totalMessages, unreadMessages, totalExperience, totalCertificates, totalTestimonials, totalAchievements, recentMessages]
      properties:
        totalProjects:
          type: integer
        featuredProjects:
          type: integer
        totalSkills:
          type: integer
        totalMessages:
          type: integer
        unreadMessages:
          type: integer
        totalExperience:
          type: integer
        totalCertificates:
          type: integer
        totalTestimonials:
          type: integer
        totalAchievements:
          type: integer
        recentMessages:
          type: array
          items:
            $ref: "#/components/schemas/ContactMessage"

    # ─── GitHub Stats ─────────────────────────────────────────────────────────
    GithubStats:
      type: object
      required: [username, publicRepos, followers, following, totalStars, totalCommits, contributionStreak, topLanguages]
